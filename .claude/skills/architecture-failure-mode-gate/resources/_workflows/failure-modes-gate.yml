name: Failure-mode table gate

# Owned by the architecture-failure-mode-gate skill at
# __SKILL_PATH__/SKILL.md.
# Templates live under __SKILL_PATH__/resources/_workflows/; this file is
# regenerated by __SKILL_PATH__/scripts/install.py — DO NOT EDIT HERE.
#
# Gate behavior:
#   - Runs the linter against the PR diff.
#   - On lint failure: posts a REQUEST_CHANGES PR review carrying the lint
#     errors + override instructions; the workflow itself exits 0 so the
#     PR check stays green. The review is the actionable signal — branch
#     protection can be set to require approving reviews, in which case
#     the REQUEST_CHANGES blocks merge until dismissed.
#   - On lint pass: dismisses any prior REQUEST_CHANGES review authored
#     by github-actions[bot] on this PR (so a fix re-clears the gate
#     without manual cleanup).
#
# Override (when an arch-doc change does NOT affect coverage):
#   The agent reviews, decides, and either fixes the column or dismisses
#   the review with a justification comment. The dismissal procedure is
#   in __SKILL_PATH__/SKILL.md "Handling the gate review".

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'architectures/**'
      - '__SKILL_PATH__/**'
      - '.github/workflows/failure-modes-gate.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Honor failure-mode-only PR label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"failure-mode-only"'; then
            echo "FAILURE_MODE_ONLY=1" >> "$GITHUB_ENV"
            echo "Label 'failure-mode-only' present — column-only edits permitted."
          fi
      - name: Run linter
        id: lint
        continue-on-error: true
        run: |
          set +e
          OUT=$(python __SKILL_PATH__/scripts/lint-failure-modes.py \
                  --check-diff "${{ github.event.pull_request.base.sha }}" 2>&1)
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo "out<<EOF_LINT_OUTPUT"
            echo "$OUT"
            echo "EOF_LINT_OUTPUT"
          } >> "$GITHUB_OUTPUT"
          echo "$OUT"
          exit 0
      - name: Post or dismiss PR review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RC: ${{ steps.lint.outputs.rc }}
          LINT_OUT: ${{ steps.lint.outputs.out }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          # Find any prior REQUEST_CHANGES reviews from this workflow.
          PRIOR=$(gh api "/repos/$OWNER/$REPO/pulls/$PR/reviews" \
                    --jq '.[] | select(.user.login == "github-actions[bot]"
                                        and .state == "CHANGES_REQUESTED")
                                | .id')
          if [ "$RC" = "0" ]; then
            echo "Lint passed."
            if [ -n "$PRIOR" ]; then
              for ID in $PRIOR; do
                echo "Dismissing prior REQUEST_CHANGES review $ID."
                gh api -X PUT "/repos/$OWNER/$REPO/pulls/$PR/reviews/$ID/dismissals" \
                  -f message="Gate now passing at $HEAD_SHA." >/dev/null
              done
            fi
            exit 0
          fi
          # Lint failed. Post REQUEST_CHANGES with override instructions.
          BODY=$(cat <<EOF
          **Failure-mode table gate**

          The lint detected drift between architecture documents and the
          per-architecture coverage matrix in \`architectures/failure-modes.md\`.

          \`\`\`
          $LINT_OUT
          \`\`\`

          **What to do (agent or human reviewer):**

          1. Decide whether the architecture change materially affects
             failure-mode coverage. The skill documents what counts as
             "material" at \`__SKILL_PATH__/SKILL.md\` "Handling the gate review".
          2. If YES — update only the corresponding column in
             \`architectures/failure-modes.md\` and push. This review will
             auto-dismiss when lint passes.
          3. If NO — dismiss this review with a justification comment
             explaining why the change does not affect coverage. The
             skill documents the dismissal procedure.

          For cell-wording refinements with no arch-doc edit, apply the
          PR label \`failure-mode-only\` instead.
          EOF
          )
          echo "Posting REQUEST_CHANGES review."
          gh api -X POST "/repos/$OWNER/$REPO/pulls/$PR/reviews" \
            -f event="REQUEST_CHANGES" \
            -f body="$BODY" \
            -f commit_id="$HEAD_SHA" >/dev/null
          # Workflow itself exits 0 — the review is the signal.
          exit 0
