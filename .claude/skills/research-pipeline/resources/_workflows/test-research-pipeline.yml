name: Test research-pipeline scripts

# Runs the pipeline's pytest suite whenever scripts or tests change.
# Required for merge — keeps the catalog tooling honest.

on:
  push:
    paths:
      - '__SKILL_PATH__/scripts/**'
      - '__SKILL_PATH__/tests/**'
      - 'reference-only/sources.schema.json'
  pull_request:
    paths:
      - '__SKILL_PATH__/scripts/**'
      - '__SKILL_PATH__/tests/**'
      - 'reference-only/sources.schema.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: pip install pyyaml jsonschema pytest
      - name: Run unit tests
        run: cd __SKILL_PATH__ && python -m pytest tests/unit -v
      - name: Run integration tests
        run: cd __SKILL_PATH__ && python -m pytest tests/integration -v
