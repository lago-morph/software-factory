name: Fetch Blocked URLs

# This workflow exists because the sandbox the research agent runs in blocks
# essentially every host except raw.githubusercontent.com. When the agent
# needs the live web — a Substack post, an arXiv paper, a docs site, etc. —
# it opens an issue titled "[fetch-urls] ..." with one URL per line in the
# body. This workflow fetches each URL from a normal GitHub runner (which is
# not behind the sandbox's allowlist), commits the results to a new branch
# named `fetched/issue-<n>`, and posts a comment linking back to the branch.
#
# Security model — see research/PLAN.md §6 for the full discussion.
#
#   1. Label gate: the workflow only proceeds when the issue carries the
#      `fetch-urls` label. Only users with the Triage role or higher (i.e.
#      explicit repo collaborators) can apply labels, so the label IS the
#      author check. We avoid `author_association` because the webhook
#      payload and the REST API disagree on its value (the REST API said
#      MEMBER for jonathanmanton, the webhook said CONTRIBUTOR — every
#      pre-label version of this workflow silent-skipped because of that).
#      The fetch-urls label must exist in the repo; creating it on the
#      fly via the issue UI's label picker is the easiest way.
#
#   2. Permissions are scoped: contents:write (to push the branch) and
#      issues:write (to comment). No secrets are accessed. The workflow
#      only reads URLs from the issue body — it never executes fetched
#      content.
#
#   3. Per-issue cap: at most 50 URLs and a 30-second per-URL timeout.
#      The workflow refuses (with a comment) and exits non-zero if the
#      cap is exceeded.
#
#   4. Never pushes to main. Always creates a new branch
#      fetched/issue-<n> off the default branch.

on:
  issues:
    # `labeled` covers the common case (issue exists, label applied).
    # `edited` covers re-running against an already-labeled issue by
    # editing its body. `opened` covers issues that are created with the
    # label already attached via the API.
    types: [opened, edited, labeled, reopened]
  # workflow_dispatch lets us re-test against an existing issue without
  # editing it. Supply the issue number; the workflow reads body via the
  # gh CLI and bypasses the label gate (only users with actions:write
  # can dispatch anyway).
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number whose body contains the URLs to fetch"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-blocked-urls-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch URLs from issue body
    runs-on: ubuntu-latest

    # NO job-level `if:`. Job-level skips are silent in the Actions UI
    # (zero step logs, the word "Skipped" only). v1 and v2 both got
    # silent-skipped without us being able to see why. This version
    # always runs the job and uses logged steps for every gate, so the
    # next failure is diagnosable from the run page.
    #
    # Cost: every issue event (opened/edited/reopened) on this repo
    # spins up a runner for ~10s of context-printing before the
    # title-prefix step exits cleanly on non-matching issues. That is
    # a deliberate trade for diagnosability.

    steps:
      - name: Show context for diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER_FROM_EVENT: ${{ github.event.issue.number }}
          ISSUE_NUMBER_FROM_INPUT: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_ASSOC: ${{ github.event.issue.author_association }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          JUST_LABELED: ${{ github.event.label.name }}
        run: |
          echo "event_name         = $EVENT_NAME"
          echo "event.action       = $ACTION"
          echo "actor              = $ACTOR"
          echo "issue # (event)    = $ISSUE_NUMBER_FROM_EVENT"
          echo "issue # (input)    = $ISSUE_NUMBER_FROM_INPUT"
          echo "issue title        = $ISSUE_TITLE"
          echo "issue user         = $ISSUE_USER"
          echo "issue association  = $ISSUE_ASSOC"
          echo "issue body length  = ${#ISSUE_BODY}"
          echo "issue labels       = $ISSUE_LABELS_JSON"
          echo "just-applied label = $JUST_LABELED"

      - name: Enforce label gate
        id: label_gate
        if: github.event_name == 'issues'
        env:
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          # The `fetch-urls` label is the security boundary. Only users
          # with Triage role or higher can apply labels in GitHub, so
          # the label's presence proves the author has at least triage
          # access to this repo.
          if echo "$LABELS_JSON" | grep -q '"fetch-urls"'; then
            echo "Issue carries the fetch-urls label; proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue does not carry the fetch-urls label; exiting cleanly."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve issue number
        id: resolve
        if: github.event_name == 'workflow_dispatch' || steps.label_gate.outputs.proceed == 'true'
        env:
          ISSUE_NUMBER_FROM_EVENT: ${{ github.event.issue.number }}
          ISSUE_NUMBER_FROM_INPUT: ${{ inputs.issue_number }}
        run: |
          if [ -n "${ISSUE_NUMBER_FROM_EVENT}" ]; then
            echo "issue_number=${ISSUE_NUMBER_FROM_EVENT}" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=${ISSUE_NUMBER_FROM_INPUT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.resolve.outputs.issue_number != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.resolve.outputs.issue_number != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.resolve.outputs.issue_number != ''
        run: |
          python -m pip install --upgrade pip
          # html2text is small and pure-python; used for HTML -> markdown.
          # No other deps are required.
          pip install "html2text==2024.2.26"

      - name: Resolve issue body
        id: body
        if: steps.resolve.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          BODY_FROM_EVENT: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .fetch-work
          if [ -n "${BODY_FROM_EVENT}" ]; then
            printf '%s' "$BODY_FROM_EVENT" > .fetch-work/body.txt
          else
            gh issue view "$ISSUE_NUMBER" \
              --repo "${GITHUB_REPOSITORY}" \
              --json body \
              --jq '.body' > .fetch-work/body.txt
          fi
          echo "Body length: $(wc -c < .fetch-work/body.txt) bytes."

      - name: Extract URLs from issue body
        id: extract
        if: steps.resolve.outputs.issue_number != ''
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        run: |
          set -euo pipefail
          BODY="$(cat .fetch-work/body.txt)" \
            python3 .github/scripts/extract_urls.py > .fetch-work/urls.txt
          count=$(wc -l < .fetch-work/urls.txt | tr -d ' ')
          echo "url_count=$count" >> "$GITHUB_OUTPUT"
          echo "Extracted $count URLs."
          if [ "$count" -eq 0 ]; then
            echo "no_urls=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$count" -gt 50 ]; then
            echo "too_many=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment and abort if too many URLs
        if: steps.extract.outputs.too_many == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.ISSUE_NUMBER, 10),
              body: `Refusing to fetch: the issue body contains more than 50 URLs (${{ steps.extract.outputs.url_count }}). Split into multiple issues and try again.`,
            });
            core.setFailed('Too many URLs');

      - name: Comment and exit cleanly if no URLs
        if: steps.extract.outputs.no_urls == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.ISSUE_NUMBER, 10),
              body: `No URLs found in the issue body. Put one URL per line (markdown links are accepted).`,
            });

      - name: Fetch URLs
        if: steps.extract.outputs.too_many != 'true' && steps.extract.outputs.no_urls != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        run: bash .github/scripts/fetch_urls.sh

      - name: Commit and push fetched files
        if: steps.extract.outputs.too_many != 'true' && steps.extract.outputs.no_urls != 'true'
        id: commit
        env:
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          BRANCH="fetched/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # If the branch already exists upstream (re-fetch on an edited issue),
          # reset its history rather than appending to it — the issue body is
          # the source of truth.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; will force-update."
            git fetch origin "$BRANCH":"$BRANCH" || true
          fi
          git checkout -B "$BRANCH"

          git add research/fetched/
          # Always include the URL manifest so reviewers can see what was asked for.
          git add -f .fetch-work/urls.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit (every fetch failed?)."
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Fetch URLs for issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          git push -u origin "$BRANCH" --force-with-lease
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Comment with results
        if: steps.extract.outputs.too_many != 'true' && steps.extract.outputs.no_urls != 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          EMPTY: ${{ steps.commit.outputs.empty }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const branch = process.env.BRANCH;
            const empty = process.env.EMPTY === 'true';
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const summaryPath = '.fetch-work/summary.md';
            let summary = '';
            if (fs.existsSync(summaryPath)) {
              summary = fs.readFileSync(summaryPath, 'utf8');
            }
            let body;
            if (empty) {
              body = `Every fetch failed for this issue. See logs of run ${context.runId}.\n\n${summary}`;
            } else {
              body = `Fetched URLs committed to branch \`${branch}\`. ` +
                     `To merge into your working branch:\n\n` +
                     `\`\`\`\ngit fetch origin ${branch}\ngit merge --no-ff origin/${branch}\n\`\`\`\n\n` +
                     `### Per-URL summary\n\n${summary}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
