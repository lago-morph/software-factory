name: Fetch blocked sources

# Trigger: someone opens or labels an issue.
# Authorization: BOTH (1) the issue must carry the `fetch-sources` label,
# AND (2) the issue author must be in the allowlist (defaults to the
# repository owner; override via repo variable FETCH_ALLOWED_AUTHORS).
# Anything else short-circuits and the job never runs.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-sources-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch URLs into the repo
    if: >-
      contains(github.event.issue.labels.*.name, 'fetch-sources') &&
      contains(fromJSON(vars.FETCH_ALLOWED_AUTHORS || format('["{0}"]', github.repository_owner)), github.event.issue.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch URLs from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/fetch_sources.py

      - name: Commit fetched files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only HTML files at repo root (the fetcher's output target).
          # Do NOT stage anything in research/, architectures/, etc.
          # `--` separates pathspec from refs; `:!:research/**` excludes subdirs.
          git add -- '*.html' || true

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No new files to commit."
          else
            git commit -m "Fetch sources for issue #${{ github.event.issue.number }} (by @${{ github.event.issue.user.login }})"
            # Retry push with exponential backoff per repo convention.
            for attempt in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # Backoff: 2s, 4s, 8s, 16s
              sleep $((2 ** attempt))
            done
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Push failed after 4 attempts." >&2
            exit 1
          fi

      - name: Comment on issue and close
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Fetch results\n\n';
            try {
              body += fs.readFileSync('.github/fetch-result.md', 'utf8');
            } catch (e) {
              body += '_No fetch result file produced. The fetcher likely failed before reporting._';
            }
            const committed = '${{ steps.commit.outputs.committed }}' === 'true';
            body += committed
              ? '\n\n---\n\nFiles committed to `${{ github.ref_name }}`. Pull/fetch the branch to access them.'
              : '\n\n---\n\nNo files were committed (no URLs found, all fetches failed, or push was rejected).';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });
